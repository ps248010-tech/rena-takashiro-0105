<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>予約完了</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background: #f2f2f2;
      color: #333;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #555;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 22px;
      background: #1e88e5;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>予約完了</h1>
      <p>
        ご予約ありがとうございます。<br>
        内容を確認のうえ、後日ご連絡いたします。
      </p>

      <a href="reservation.html">予約画面に戻る</a>
    </div>
  </div>
</body>
</html>
