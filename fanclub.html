<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fanclub｜高城玲奈 Official Web Site</title>

  <style>
    body{
      margin:0;
      color:#111;
      background:#fff;
      font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;
      line-height:1.9;
      letter-spacing:0.02em;
    }
    a{ color:inherit; text-decoration:none; }

    header{ border-bottom:1px solid #e6e6e6; background:#fff; }
    .header-inner{
      max-width:1000px; margin:0 auto; padding:18px;
      display:flex; justify-content:space-between; align-items:center; gap:16px;
    }
    .brand{ display:flex; gap:12px; align-items:baseline; white-space:nowrap; }
    .brand .jp{ font-size:18px; font-weight:700; letter-spacing:0.10em; }
    .brand .en{ font-size:12px; color:#666; font-style:italic; }
    nav{ display:flex; gap:18px; font-size:13px; color:#666; flex-wrap:wrap; justify-content:flex-end; }
    nav a{ padding:6px 2px; border-bottom:1px solid transparent; }
    nav a:hover{ border-bottom-color:#e6e6e6; }

    main{ max-width:1000px; margin:0 auto; padding:40px 18px 80px; }
    h1{ margin:0 0 8px; font-size:28px; letter-spacing:0.10em; }
    .lead{ margin:0 0 22px; color:#666; font-size:14px; }

    .wrap{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:18px;
      align-items:start;
    }

    .box{
      border:1px solid #e6e6e6;
      padding:22px;
      background:#fff;
    }

    .box h2{
      margin:0 0 12px;
      font-size:16px;
      letter-spacing:0.12em;
      border-left:3px solid #111;
      padding-left:10px;
    }

    .small{ margin:0; color:#666; font-size:13px; }

    .reserve{
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }
    .reserve img{
      width:min(260px, 78vw);
      height:auto;
      display:block;
    }
    .hint{ margin:0; font-size:12px; color:#666; }

    footer{ border-top:1px solid #e6e6e6; color:#666; font-size:12px; padding:18px; text-align:center; }

    @media (max-width: 820px){
      .wrap{ grid-template-columns: 1fr; }
      .brand .en{ display:none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="jp">高城 玲奈</div>
        <div class="en">Rena Takashiro</div>
      </div>
      <nav>
        <a href="index.html">Top</a>
        <a href="profile.html">Profile</a>
        <a href="history.html">History</a>
        <a href="fanclub.html">Fanclub</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Fanclub</h1>
    <p class="lead">ファンクラブ・お問い合わせのご案内です。</p>

    <div class="wrap">
      <section class="box">
        <h2>ファンクラブについて</h2>
        <p class="small">
          最新情報の先行公開や、限定コンテンツの配信などを予定しています。<br>
          参加をご希望の方は、下の予約フォームからお申し込みください。
        </p>

        <div class="reserve">
          <a href="reservation.html" aria-label="予約フォームへ移動">
            <img src="https://ps248010-tech.github.io/rena-takashiro-0105/images/4.png" alt="予約する">
          </a>
          <p class="hint">※ クリックすると予約フォームへ移動します</p>
        </div>
      </section>

      <aside class="box">
        <h2>連絡先</h2>
        <p class="small">
          rena.takashiro@stardalia.jp<br>
          info@stardalia.jp
        </p>

        <h2 style="margin-top:20px;">SNS</h2>
        <p class="small">X / Instagram</p>
      </aside>
    </div>
  </main>

  <footer>© Stardalia Entertainment Promotion</footer>
</body>
</html>
