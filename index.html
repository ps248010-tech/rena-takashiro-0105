<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高城玲奈｜公式サイト</title>

  <!-- スマホ対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== 全体設定 ===== */
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #333;
      background-color: #fafafa;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== ヘッダー ===== */
    header {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    header img {
      height: 40px;
    }

    header h1 {
      margin-left: 12px;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* ===== メイン ===== */
    .hero {
      padding: 60px 20px;
      background-color: #f2f2f2;
    }

    .hero-inner {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      gap: 48px;
      align-items: center;
    }

    /* ===== 画像エリア ===== */
    .hero-image {
      flex: 1;
    }

    .main-photo {
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      display: block;
    }

    .gallery {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .gallery img {
      width: 120px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* ===== テキスト ===== */
    .hero-text {
      flex: 1;
    }

    .hero-text h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero-text p {
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 24px;
    }

    /* ===== 予約ボタン ===== */
    .reserve-btn img {
      width: 200px;
    }

    /* ===== フッター ===== */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #777;
      background: #fff;
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 768px) {
      .hero-inner {
        flex-direction: column;
        text-align: center;
      }

      .hero-text h2 {
        font-size: 26px;
      }

      .gallery {
        justify-content: center;
      }

      .gallery img {
        width: 45%;
        max-width: 160px;
      }
    }
  </style>
</head>

<body>

  <!-- ===== ヘッダー ===== -->
  <header>
    <img src="images/2.png" alt="スターダリアエンターテインメントのロゴ">
    <h1>STARDALIA ENTERTAINMENT</h1>
  </header>

  <!-- ===== メイン ===== -->
  <section class="hero">
    <div class="hero-inner">

      <!-- 画像 -->
      <div class="hero-image">
        <img src="images/1.png" alt="高城玲奈 メインビジュアル" class="main-photo">

        <div class="gallery">
          <img src="images/2.png" alt="プロフィール写真">
          <img src="images/3.png" alt="追加写真3">
          <img src="images/4.png" alt="追加写真4">
        </div>
      </div>

      <!-- テキスト -->
      <div class="hero-text">
        <h2>高城 玲奈</h2>
        <p>
          Rena Takashiro<br>
          女優 / Actress<br><br>
          映画・ドラマを中心に活動。<br>
          繊細な感情表現と透明感を強みにしています。
        </p>

        <a href="#" class="reserve-btn">
          <img src="images/4.png" alt="予約する">
        </a>
      </div>

    </div>
  </section>

  <!-- ===== フッター ===== -->
  <footer>
    © Stardalia Entertainment Promotion
  </footer>

</body>
</html>
