<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高城玲奈｜公式サイト</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== 全体 ===== */
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #333;
      background-color: #fafafa;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== ヘッダー ===== */
    header {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .logo {
      height: 48px;
    }

    header h1 {
      margin-left: 14px;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* ===== メイン ===== */
    .hero {
      padding: 60px 20px;
      background-color: #f2f2f2;
    }

    .hero-inner {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      gap: 40px;
      align-items: flex-start;
    }

    .hero-image {
      flex: 1;
    }

    .hero-image img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .gallery {
      display: flex;
      gap: 12px;
    }

    .gallery img {
      width: 120px;
      border-radius: 6px;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero-text p {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    /* ===== 予約ボタン ===== */
    .reserve-btn img {
      width: 240px;
    }

    /* ===== フッター ===== */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #777;
    }

    /* ===== スマホ ===== */
    @media (max-width: 768px) {
      .hero-inner {
        flex-direction: column;
        text-align: center;
      }

      .gallery {
        justify-content: center;
      }

      header {
        justify-content: center;
      }

      header h1 {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- ===== ヘッダー ===== -->
  <header>
    <img
      src="https://ps248010-tech.github.io/rena-takashiro-0105/images/5.png"
      alt="STARDALIA ENTERTAINMENT ロゴ"
      class="logo"
    >
    <h1>STARDALIA ENTERTAINMENT</h1>
  </header>

  <!-- ===== メイン ===== -->
  <section class="hero">
    <div class="hero-inner">

      <!-- 左：画像 -->
      <div class="hero-image">
        <img
          src="https://ps248010-tech.github.io/rena-takashiro-0105/images/1.png"
          alt="メインビジュアル"
        >

        <div class="gallery">
          <img
            src="https://ps248010-tech.github.io/rena-takashiro-0105/images/2.png"
            alt="プロフィール写真1"
          >
          <img
            src="https://ps248010-tech.github.io/rena-takashiro-0105/images/3.png"
            alt="プロフィール写真2"
          >
        </div>
      </div>

      <!-- 右：テキスト -->
      <div class="hero-text">
        <h2>高城 玲奈</h2>
        <p>
          Rena Takashiro<br>
          女優 / Actress<br><br>
          映画・ドラマを中心に活動。<br>
          繊細な感情表現と透明感を強みにしています。
        </p>

        <!-- ★予約ボタン：reservation.html へ移動 -->
        <a href="reservation.html" class="reserve-btn">
          <img
            src="https://ps248010-tech.github.io/rena-takashiro-0105/images/4.png"
            alt="予約するボタン"
          >
        </a>
      </div>

    </div>
  </section>

  <!-- ===== フッター ===== -->
  <footer>
    © Stardalia Entertainment Promotion
  </footer>

</body>
</html>
