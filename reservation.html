<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予約フォーム</title>

  <!--
    =========================
    予約フォーム用 CSS
    ・背景：薄いグレー
    ・フォーム：白背景＋角丸＋影
    ・文字サイズを少し大きめ
    ・スマホ対応
    =========================
  -->
  <style>
    /* 全体の基本設定 */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      background: #eeeeee;      /* 薄いグレー背景 */
      color: #333;
      line-height: 1.7;
      font-size: 16px;          /* 文字を少し大きく */
    }

    /* フォームを中央に配置 */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* フォーム本体 */
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;      /* 白背景 */
      border-radius: 16px;      /* 角を丸く */
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); /* 影 */
    }

    /* タイトル */
    h1 {
      font-size: 22px;
      margin: 0 0 12px;
      text-align: center;
    }

    .note {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    /* 入力欄 */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #cccccc;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
    }

    /* 入力中の見た目 */
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1e88e5;
      box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.2);
    }

    /* 送信ボタン */
    .btn {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 14px;
      border: none;
      background: #1e88e5;
      color: #ffffff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* 必須表示 */
    .required {
      color: #e53935;
      font-size: 12px;
      margin-left: 6px;
    }

    /* スマホ用微調整 */
    @media (max-width: 420px) {
      .card {
        padding: 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="card">
      <h1>予約フォーム</h1>
      <p class="note">以下の内容を入力して送信してください。</p>

      <!--
        フォーム本体
        action="" → 送信先（後で thanks.html などを指定）
      -->
      <form action="" method="post">
        <!-- 名前 -->
        <div class="field">
          <label for="name">お名前 <span class="required">必須</span></label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="例）山田 花子"
            required
          />
        </div>

        <!-- メールアドレス -->
        <div class="field">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="例）example@mail.com"
            required
          />
        </div>

        <!-- 希望日 -->
        <div class="field">
          <label for="date">希望日 <span class="required">必須</span></label>
          <input type="date" id="date" name="date" required />
        </div>

        <!-- メッセージ -->
        <div class="field">
          <label for="message">メッセージ</label>
          <textarea
            id="message"
            name="message"
            placeholder="例）午前中希望です。初回相談をお願いしたいです。"
          ></textarea>
        </div>

        <!-- 送信ボタン -->
        <button class="btn" type="submit">送信する</button>
      </form>
    </main>
  </div>
</body>
</html>
