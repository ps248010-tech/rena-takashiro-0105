<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予約フォーム</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans JP", sans-serif;
      color: #333;
      background: #eeeeee;
      line-height: 1.7;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 22px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .req {
      color: #e53935;
      margin-left: 6px;
      font-size: 13px;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #cfcfcf;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1e88e5;
      box-shadow: 0 0 0 4px rgba(30,136,229,0.18);
    }

    .radio-wrap {
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 14px;
      background: #fafafa;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      font-size: 16px;
    }

    .pay-note {
      margin-top: 6px;
      font-size: 13px;
      color: #666;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      background: #1e88e5;
      color: #fff;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="card">
      <h1>予約フォーム</h1>
      <p class="sub">以下の内容を入力して予約してください。</p>

      <form id="reservationForm" action="#" method="post">
        <!-- 氏名 -->
        <div class="field">
          <label for="name">氏名<span class="req">必須</span></label>
          <input type="text" id="name" name="name" required>
        </div>

        <!-- メール -->
        <div class="field">
          <label for="email">メールアドレス<span class="req">必須</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <!-- 希望日 -->
        <div class="field">
          <label for="date">希望日<span class="req">必須</span></label>
          <input type="date" id="date" name="date" required>
        </div>

        <!-- 支払方法 -->
        <div class="field">
          <label>支払方法<span class="req">必須</span></label>
          <div class="radio-wrap">
            <label class="radio-item">
              <input type="radio" name="payment" value="現地支払い" required>
              現地支払い
            </label>
            <label class="radio-item">
              <input type="radio" name="payment" value="銀行振り込み">
              銀行振り込み
            </label>
            <label class="radio-item">
              <input type="radio" name="payment" value="クレジットカード（番号入力なし）">
              クレジットカード（番号入力なし）
            </label>
            <p class="pay-note">※支払情報（番号など）の入力は不要です</p>
          </div>
        </div>

        <!-- メッセージ -->
        <div class="field">
          <label for="message">メッセージ（任意）</label>
          <textarea id="message" name="message"></textarea>
        </div>

        <button class="btn" type="submit">予約を送信する</button>
      </form>
    </main>
  </div>

  <!-- ✅ JSは body の最後 -->
  <script src="app.js?v=2"></script>
</body>
</html>
