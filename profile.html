<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile｜高城玲奈 Official Web Site</title>

  <style>
    body{
      margin:0;
      color:#111;
      background:#fff;
      font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;
      line-height:1.9;
      letter-spacing:0.02em;
    }
    a{ color:inherit; text-decoration:none; }

    header{
      border-bottom:1px solid #e6e6e6;
      background:#fff;
    }
    .header-inner{
      max-width:1000px;
      margin:0 auto;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:baseline;
      white-space:nowrap;
    }
    .brand .jp{ font-size:18px; font-weight:700; letter-spacing:0.10em; }
    .brand .en{ font-size:12px; color:#666; font-style:italic; }

    nav{
      display:flex;
      gap:18px;
      font-size:13px;
      color:#666;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    nav a{ padding:6px 2px; border-bottom:1px solid transparent; }
    nav a:hover{ border-bottom-color:#e6e6e6; }

    main{
      max-width:1000px;
      margin:0 auto;
      padding:40px 18px 80px;
    }
    h1{
      margin:0 0 8px;
      font-size:28px;
      letter-spacing:0.10em;
    }
    .lead{
      margin:0 0 22px;
      color:#666;
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1.2fr;
      gap:22px;
      align-items:start;
    }

    .photos{
      display:grid;
      gap:12px;
    }
    .photos img{
      width:100%;
      display:block;
      border:1px solid #eee;
      background:#fafafa;
    }

    .card{
      border:1px solid #e6e6e6;
      padding:22px;
    }
    .name{
      margin:0 0 8px;
      font-size:26px;
      letter-spacing:0.12em;
      font-weight:700;
    }
    .name-en{
      margin:0 0 14px;
      color:#666;
      font-size:12px;
      font-style:italic;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th, td{
      padding:10px 12px;
      border-bottom:1px solid #eee;
      vertical-align:top;
    }
    th{
      width:160px;
      text-align:left;
      color:#333;
      font-weight:700;
      letter-spacing:0.06em;
    }
    td{ color:#333; }

    .reserve{
      margin-top:18px;
      display:flex;
      justify-content:flex-end;
      gap:12px;
      align-items:center;
      border-top:1px solid #e6e6e6;
      padding-top:16px;
    }
    .reserve img{
      width:min(240px, 70vw);
      height:auto;
      display:block;
    }
    .hint{
      margin:0;
      font-size:12px;
      color:#666;
    }

    footer{
      border-top:1px solid #e6e6e6;
      color:#666;
      font-size:12px;
      padding:18px;
      text-align:center;
    }

    @media (max-width: 820px){
      .grid{ grid-template-columns: 1fr; }
      .brand .en{ display:none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="jp">高城 玲奈</div>
        <div class="en">Rena Takashiro</div>
      </div>
      <nav>
        <a href="index.html">Top</a>
        <a href="profile.html">Profile</a>
        <a href="history.html">History</a>
        <a href="fanclub.html">Fanclub</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Profile</h1>
    <p class="lead">プロフィール情報をご紹介します。</p>

    <div class="grid">
      <div class="photos">
        <img src="https://ps248010-tech.github.io/rena-takashiro-0105/images/2.png" alt="プロフィール写真1">
        <img src="https://ps248010-tech.github.io/rena-takashiro-0105/images/3.png" alt="プロフィール写真2">
      </div>

      <section class="card">
        <h2 class="name">高城 玲奈</h2>
        <p class="name-en">Rena Takashiro</p>

        <table>
          <tr><th>職業</th><td>女優 / Actress</td></tr>
          <tr><th>活動</th><td>映画・ドラマを中心に活動。</td></tr>
          <tr><th>特徴</th><td>繊細な感情表現と透明感。</td></tr>
          <tr><th>趣味</th><td>映画鑑賞・読書</td></tr>
          <tr><th>特技</th><td>ピアノ</td></tr>
        </table>

        <div class="reserve">
          <p class="hint">※ クリックすると予約フォームへ移動します</p>
          <a href="reservation.html">
            <img src="https://ps248010-tech.github.io/rena-takashiro-0105/images/4.png" alt="予約する">
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer>© Stardalia Entertainment Promotion</footer>
</body>
</html>
